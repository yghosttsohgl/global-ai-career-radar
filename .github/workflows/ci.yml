name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint (syntax errors + undefined names)
        run: ruff check --select E9,F63,F7,F82 radar dashboard tests

      - name: Byte-compile all modules
        run: python -m compileall -q radar dashboard

      - name: Tests
        run: python -m pytest -q
