name: Global AI Career Radar

on:
  schedule:
    # 06:00 UTC ~= 07:00-08:00 Europe/Vienna depending on DST.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Never let two runs (e.g. a manual dispatch during the daily cron) race on
# the job-database commit.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Scan sources, LLM-score, send digest
        env:
          # Optional - leave this secret unset entirely to run on free
          # rule-based scoring only; llm_scoring.py skips itself cleanly.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Optional aggregator APIs - sources skip themselves if unset.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
        run: python -m radar.cli run

      - name: Commit updated job database
        run: |
          git config user.name "global-ai-career-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- data/jobs.sqlite3; then
            echo "No database changes to commit."
            exit 0
          fi

          # The scan takes a few minutes; main may have moved (a code push, or
          # another run) since checkout. The freshly-scanned DB always wins -
          # its rows carry first_seen / notified_at - so reset onto the latest
          # main, drop the new DB back in, and retry the push a few times.
          cp data/jobs.sqlite3 "$RUNNER_TEMP/jobs.sqlite3"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/jobs.sqlite3" data/jobs.sqlite3
            if git diff --quiet -- data/jobs.sqlite3; then
              echo "Latest main already has this database."
              exit 0
            fi
            git add data/jobs.sqlite3
            git commit -m "Update job database"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt rejected (main moved), retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::could not push updated job database after 5 attempts"
          exit 1
