name: Global AI Career Radar

on:
  schedule:
    # 06:00 UTC ~= 07:00-08:00 Europe/Vienna depending on DST.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time so the cached job database is never written concurrently.
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # The job database is not in git (it holds scraped postings and per-run
      # LLM assessments). Persist it between scheduled runs via the Actions
      # cache: restore the most recent copy, then save a fresh one each run.
      - name: Restore job database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.sqlite3
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Scan sources, LLM-score, send digest
        env:
          # Optional - leave this secret unset entirely to run on free
          # rule-based scoring only; llm_scoring.py skips itself cleanly.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          # Optional aggregator APIs - sources skip themselves if unset.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
        run: python -m radar.cli run

      - name: Save job database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.sqlite3
          key: jobs-db-${{ github.run_id }}
