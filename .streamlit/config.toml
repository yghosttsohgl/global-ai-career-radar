# Dashboard theme. Only the accent colour is overridden - Streamlit still
# derives the light/dark palettes, and the mode toggle stays available because
# primaryColor is set under both [theme.light] and [theme.dark].
#
# The accent drives sliders, toggles and other active widgets in the Filters
# panel (Streamlit's default is a bright red).

[theme]
primaryColor = "#9CA3AF"   # mid grey

[theme.light]
primaryColor = "#9CA3AF"   # mid grey on white

[theme.dark]
primaryColor = "#CBD5E1"   # lighter grey, for contrast on dark backgrounds
