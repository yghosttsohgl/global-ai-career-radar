sources:
  - name: Anthropic Careers
    type: greenhouse
    board: anthropic
    country: Japan
    # Anthropic's board lists jobs worldwide; only keep postings whose office
    # location mentions one of these (case-insensitive substring match).
    location_filter: ["japan", "tokyo"]
    enabled: true

  - name: Sakana AI Careers
    type: html_list
    url: https://sakana.ai/careers/
    country: Japan
    location: Tokyo
    # Only anchors matching this path are real job postings (excludes nav,
    # the careers index itself, etc).
    link_pattern: '^/careers/[a-z0-9-]+/?$'
    enabled: true

  - name: PayPay Careers
    type: greenhouse
    board: paypay
    country: Japan
    # Tokyo-based, English-friendly workplace. The board is ~85 roles spanning
    # finance/HR/audit - title_filter keeps it to AI/ML/data/product only.
    title_filter:
      - "product manager"
      - "プロダクトマネージャー"
      - "machine learning"
      - "ml engineer"
      - "data scien"
      - "data engineer"
      - "機械学習"
      - "ai "
      - "/ ai"
      - "nlp"
      - "llm"
    enabled: true

  - name: Duolingo Careers
    type: greenhouse
    board: duolingo
    country: China
    # Beijing engineering/product hub plus occasional Tokyo roles; language-
    # learning ML/NLP/speech is a close thematic fit.
    location_filter: ["beijing", "china", "tokyo", "japan"]
    enabled: true

  - name: Cohere Careers
    type: ashby
    board: cohere
    # "Austria" is used here as the EU / work-permit bucket - Cohere's European
    # roles are Berlin/Munich/Paris/London/remote-Europe, plus a few in Tokyo.
    country: Austria
    location_filter:
      - "austria"
      - "vienna"
      - "germany"
      - "berlin"
      - "munich"
      - "europe"
      - "tokyo"
      - "japan"
    title_filter:
      - "machine learning"
      - "ml "
      - "research"
      - "engineer"
      - "product"
      - "evaluation"
      - "nlp"
      - "llm"
      - "data"
      - "applied ai"
    enabled: true

  - name: karriere.at AI Jobs
    type: karriere_at
    url: https://www.karriere.at/jobs/k%C3%BCnstliche-intelligenz/wien
    country: Austria
    enabled: true

  - name: AI Austria Jobs
    type: aiaustria
    url: https://aiaustria.com/jobs
    country: Austria
    enabled: true
